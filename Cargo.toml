[package]
name = "yamlquill"
version = "0.3.1"
edition = "2021"
license = "MIT"
authors = ["Joey Gibson"]
description = "YAMLQuill - A terminal-based structural YAML editor with vim-style keybindings"
repository = "https://github.com/joeygibson/yamlquill"
readme = "README.md"
keywords = ["yaml", "editor", "tui", "vim", "terminal"]
categories = ["command-line-utilities", "text-editors"]

[features]
default = ["backend-termion"]
backend-termion = ["ratatui/termion", "dep:termion"]
backend-crossterm = ["ratatui/crossterm", "dep:crossterm"]

[dependencies]
ratatui = { version = "0.30", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
yaml-rust2 = "0.11"
indexmap = { version = "2.0", features = ["serde"] }
termion = { version = "4.0", optional = true }
crossterm = { version = "0.28", optional = true }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
arboard = "3.4"
dirs = "5.0"
flate2 = "1.0"

[dev-dependencies]
tempfile = "3.13"
serde_json = "1.0"
